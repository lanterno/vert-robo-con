<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="750" viewBox="0 0 1320 750" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
<title id="t">VRC roadmap timeline</title>
<desc id="d">Six phases from Oct 19, 2026 to Jun 30, 2027, each ending at a gate A to F. The new site launches and registration opens on Dec 7, 2026. The fictional 2027 summit runs Apr 20 to 22, 2027.</desc>
<rect width="1320" height="750" fill="#FFFFFF"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#1F2937">The new site launches Dec 7, about four months before the summit</text>
<text x="40" y="86" font-size="17" fill="#6B7280">Six phases, each ending at a gate (A–F), with two developers from Oct 19. Fictional demo plan.</text>
