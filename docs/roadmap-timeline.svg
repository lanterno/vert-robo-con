<text x="780.9" y="140" font-size="17" fill="#6B7280" text-anchor="middle">Feb</text>
<line x1="868.5" y1="156" x2="868.5" y2="840" stroke="#E5E7EB" stroke-width="1"/>
<text x="868.5" y="140" font-size="17" fill="#6B7280" text-anchor="middle">Mar</text>
<line x1="965.4" y1="156" x2="965.4" y2="840" stroke="#E5E7EB" stroke-width="1"/>
<text x="965.4" y="140" font-size="17" fill="#6B7280" text-anchor="middle">Apr</text>
<line x1="1059.2" y1="156" x2="1059.2" y2="840" stroke="#E5E7EB" stroke-width="1"/>
<text x="1059.2" y="140" font-size="17" fill="#6B7280" text-anchor="middle">May</text>
<line x1="1156.2" y1="156" x2="1156.2" y2="840" stroke="#E5E7EB" stroke-width="1"/>
<text x="1156.2" y="140" font-size="17" fill="#6B7280" text-anchor="middle">Jun</text>
<line x1="605.8" y1="156" x2="605.8" y2="840" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="715.2" y1="156" x2="715.2" y2="840" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="440" y1="210" x2="1250" y2="210" stroke="#E5E7EB" stroke-width="1"/>
<text x="40" y="204" font-size="20" fill="#1F2937">1 · Public site without a database</text>
<text x="40" y="230" font-size="16" fill="#6B7280">Nov 2 – Nov 27</text>
