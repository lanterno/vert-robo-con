<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="890" viewBox="0 0 1320 890" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
<title id="t">VRC roadmap timeline</title>
<desc id="d">Six stages built one after another by one developer, from Nov 2, 2026 to Jun 30, 2027. The new public site goes live on Dec 7, 2026 and registration opens on Jan 11, 2027. The fictional 2027 summit runs Apr 20 to 22, 2027.</desc>
<rect width="1320" height="890" fill="#FFFFFF"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#1F2937">The new site goes live Dec 7, and registration opens Jan 11</text>
<text x="40" y="86" font-size="17" fill="#6B7280">Six stages built one at a time by one developer, from Nov 2. Fictional demo plan.</text>
<line x1="440" y1="156" x2="1250" y2="156" stroke="#D1D5DB" stroke-width="2"/>
<line x1="493.2" y1="156" x2="493.2" y2="840" stroke="#E5E7EB" stroke-width="1"/>
<text x="493.2" y="140" font-size="17" fill="#6B7280" text-anchor="middle">Nov 2026</text>
<line x1="587.0" y1="156" x2="587.0" y2="840" stroke="#E5E7EB" stroke-width="1"/>
<text x="587.0" y="140" font-size="17" fill="#6B7280" text-anchor="middle">Dec</text>
<line x1="683.9" y1="156" x2="683.9" y2="840" stroke="#E5E7EB" stroke-width="1"/>
<text x="683.9" y="140" font-size="17" fill="#6B7280" text-anchor="middle">Jan 2027</text>
