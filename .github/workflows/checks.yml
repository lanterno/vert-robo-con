name: Checks

# Every pull request runs the same checks the deploy runs, so a change that
# breaks a page, an accessibility rule or the outside-link rule fails before
# it reaches main (#76).

on:
  pull_request:
  workflow_dispatch:
  # So `deploy.yml` can run exactly these steps before publishing.
  workflow_call:

jobs:
  checks:
    name: Type-check and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Smoke, accessibility and outside-link checks, at desktop and phone
      # widths, against the built site in dist/.
      - name: Test
        run: bun run test

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
